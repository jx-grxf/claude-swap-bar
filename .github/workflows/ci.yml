name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build
        run: swift build -c release --disable-automatic-resolution
      - name: Verify release metadata
        run: ./script/verify_release_metadata.sh
      - name: Package app bundle
        run: ./build-app.sh
      - name: Verify bundle
        run: |
          test -x CSwap.app/Contents/MacOS/CSwapBar
          test -x CSwap.app/Contents/MacOS/cswap
          CSwap.app/Contents/MacOS/cswap help >/dev/null
          test -f CSwap.app/Contents/Resources/AppIcon.icns
          test -f CSwap.app/Contents/Resources/AppLogo.png
          test -f CSwap.app/Contents/Resources/StatusIcon.svg
          test -d CSwap.app/Contents/Frameworks/Sparkle.framework
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' CSwap.app/Contents/Info.plist)" = "https://github.com/jx-grxf/cswap/releases/latest/download/appcast.xml"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' CSwap.app/Contents/Info.plist)"
          codesign --verify --deep --strict CSwap.app
          open -n CSwap.app
          sleep 2
          pgrep -x CSwapBar
          pkill -x CSwapBar
